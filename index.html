<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greek Power Market Analytics</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="top-nav">
        <a href="#">Konstantinos Pappas Hub</a> / Live Greek Power
    </div>

    <div class="header-section">
        <div>
            <h1 class="dashboard-title">Greek Power Market Analytics</h1>
            <div class="update-info" id="last-updated">Last Update: Loading...</div>
        </div>
        <div class="controls-wrapper">
            <!-- Records Button with Notification Badge -->
            <div class="records-btn-wrapper">
                <button class="btn-records" data-bs-toggle="modal" data-bs-target="#recordsModal" onclick="loadRecords()">🏆 Records</button>
                <span id="records-badge" class="badge-pulse d-none"></span>
            </div>
            <!-- Context-Aware Dropdown -->
            <select id="context-dropdown" class="form-select custom-dropdown"></select>
            <!-- Status Pill -->
            <div class="status-pill" id="live-status-pill">● Live Data Active</div>
        </div>
    </div>

    <!-- TABS MENU -->
    <div class="nav-tabs-container">
        <a class="nav-tab-item active" data-target="tab-live">Live Analytics</a>
        <a class="nav-tab-item" data-target="tab-daily">Daily Dashboard</a>
    </div>

    <div class="main-container">
        <!-- TAB 1: LIVE ANALYTICS -->
        <div id="tab-live" class="tab-pane active">
            
            <!-- Το ΝΕΟ 4-στηλο Grid: 20% - 30% - 30% - 20% -->
            <div class="live-dashboard-grid mb-4">
                
                <!-- 1. Total Generation Ledger (20%) -->
                <div class="metric-card ledger-card">
                    <div class="metric-title">TOTAL GENERATION</div>
                    <div class="ledger-list" id="render-gen-ledger">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- 2. Supply Pie Chart (30%) -->
                <div class="chart-container" style="padding: 10px;">
                    <div id="supplyChart" style="height: 400px; width: 100%;"></div>
                </div>

                <!-- 3. Demand Pie Chart (30%) -->
                <div class="chart-container" style="padding: 10px;">
                    <div id="demandChart" style="height: 400px; width: 100%;"></div>
                </div>

                <!-- 4. Demand Ledger (20%) -->
                <div class="metric-card ledger-card">
                    <div class="metric-title">TOTAL DEMAND</div>
                    <div class="ledger-list" id="render-dem-ledger">
                        <!-- Populated by JS -->
                    </div>
                </div>

            </div>

            <!-- Flows Chart Row -->
            <div class="row">
                <div class="col-12 mb-4">
                    <div class="chart-container" id="flowsChart" style="height: 380px;"></div>
                </div>
            </div>
        </div>

        <!-- TAB 2: DAILY DASHBOARD (Παραμένει ως έχει) -->
        <div id="tab-daily" class="tab-pane">
            <div class="daily-section-card mb-4">
                <div class="section-header">Daily System Balance & Accounting Ledger</div>
                <div class="balance-equation-container" id="daily-balance-equation"></div>
            </div>
            <div class="daily-section-card mb-4">
                <div class="section-header">Daily Volume Ranking (Sorted by Cumulative MWh)</div>
                <div class="leaderboard-grid" id="daily-leaderboard"></div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="chart-container" id="dailyDispatchChart" style="height: 650px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==============================
         ALL-TIME RECORDS MODAL
         ============================== -->
    <div class="modal fade" id="recordsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content custom-modal">
                <div class="modal-header custom-modal-header">
                    <h5 class="modal-title" style="color: #ffc000; font-weight: bold;">🏆 All-Time Records</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <div class="modal-tabs-header">
                    <ul class="nav nav-tabs custom-nav-tabs" id="recordsTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#rec-hourly" type="button">Hourly (MW)</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#rec-daily" type="button">Daily (MWh / %)</button>
                        </li>
                    </ul>
                </div>

                <div class="modal-body custom-modal-body">
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="rec-hourly">
                            <div class="row" id="render-hourly-records"></div>
                        </div>
                        <div class="tab-pane fade" id="rec-daily">
                            <div class="row" id="render-daily-records"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/dashboard.js"></script>
</body>
</html>
