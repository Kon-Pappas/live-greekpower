name: Analysis history refresh

# Υπολογίζει την «Ανάλυση» (D46) για ένα διάστημα: βαθμονόμηση 90 ημερών, ανάλυση UCE,
# επίπεδα, ημερήσιο συμπέρασμα. Μόνο τοπικά αρχεία, καμία λήψη. Τρέχει χειροκίνητα.
# Το προεπιλεγμένο «Έως» είναι 3 ημέρες πριν από σήμερα (τις 2 τελευταίες τις γράφει το καθημερινό X-Ray).
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Από (YYYYMMDD)'
        required: true
        default: '20260401'
      end_date:
        description: 'Έως (YYYYMMDD) · κενό = πριν από 3 ημέρες'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: analysis-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run Analysis Builder
        env:
          BF_START: ${{ github.event.inputs.start_date }}
          BF_END: ${{ github.event.inputs.end_date }}
        run: |
          if [ -z "$BF_END" ]; then BF_END=$(TZ=Europe/Athens date -d '3 days ago' +%Y%m%d); fi
          START_DATE="$BF_START" END_DATE="$BF_END" python analysis_builder.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A data
          if git diff --staged --quiet; then
            echo "Καμία αλλαγή."
            exit 0
          fi
          git commit -m "Ανάλυση: ιστορικό ($(TZ=Europe/Athens date +'%Y-%m-%d %H:%M'))"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push απέτυχε (προσπάθεια $i), νέα δοκιμή σε 10s..."
            sleep 10
          done
          exit 1
