name: Scrape Live Greek Power Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Από (YYYYMMDD). Άστο κενό για Σήμερα.'
        required: false
        type: string
      end_date:
        description: 'Εώς (YYYYMMDD). Άστο κενό για Σήμερα.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz
        
      - name: Run scraper
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: python scraper.py
        
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/live_data.json data/records.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Ενημέρωση δεδομένων & ρεκόρ ΑΔΜΗΕ: $(date +'%Y-%m-%d %H:%M')"
          git push
