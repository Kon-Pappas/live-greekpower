name: Scrape Live Greek Power Data

# Ο προγραμματισμός γίνεται ΜΟΝΟ από το cron-job.org (κάθε ώρα στο :05),
# που καλεί αυτό το workflow μέσω workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Από (YYYYMMDD). Άστο κενό για Σήμερα.'
        required: false
        type: string
      end_date:
        description: 'Εώς (YYYYMMDD). Άστο κενό για Σήμερα.'
        required: false
        type: string

permissions:
  contents: write

# Δύο scrapes δεν τρέχουν ποτέ ταυτόχρονα (π.χ. cron + χειροκίνητο):
# το δεύτερο περιμένει να τελειώσει το πρώτο.
concurrency:
  group: scrape-live
  cancel-in-progress: false

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run scraper
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/live_data.json data/records.json
          if git diff --staged --quiet; then
            echo "Καμία αλλαγή στα δεδομένα."
            exit 0
          fi
          git commit -m "Ενημέρωση δεδομένων & ρεκόρ ΑΔΜΗΕ: $(TZ=Europe/Athens date +'%Y-%m-%d %H:%M')"
          # Αν το X-Ray workflow έσπρωξε στο μεταξύ, φέρνουμε τις αλλαγές του
          # (αγγίζει άλλα αρχεία, άρα το rebase περνά καθαρά) και ξαναδοκιμάζουμε.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push απέτυχε (προσπάθεια $i), νέα δοκιμή σε 10s..."
            sleep 10
          done
          echo "Το push απέτυχε μετά από 3 προσπάθειες."
          exit 1
