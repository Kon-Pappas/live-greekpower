name: X-Ray & ENTSO-E Backfill

# Ο προγραμματισμός γίνεται ΜΟΝΟ από το cron-job.org
# (10:15 για το αρχείο RESMV και 13:30 ως εφεδρεία αν καθυστερήσει).
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (YYYYMMDD) - Leave empty for Auto (Day Before to Yesterday)'
        required: false
        default: ''
      end_date:
        description: 'End Date (YYYYMMDD) - Leave empty for Auto'
        required: false
        default: ''

# Δύο X-Ray runs δεν τρέχουν ποτέ ταυτόχρονα: το δεύτερο περιμένει.
concurrency:
  group: xray-backfill
  cancel-in-progress: false

jobs:
  build-xray-and-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Δικαιώματα εγγραφής για να μην χτυπάει error 403 στο git push
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Απαραίτητο για να έχει το ιστορικό ώστε να κάνει επιτυχημένο rebase

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz pandas xlrd openpyxl

      - name: Run X-Ray Builder
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: python xray_builder.py

      - name: Run ENTSO-E Builder
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python entsoe_builder.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # -A: καταγράφει και τις διαγραφές (τα παλιά xray_data.json / entsoe_ref.json, φάση 3b)
          git add -A data
          if git diff --staged --quiet; then
            echo "Καμία αλλαγή στα δεδομένα."
            exit 0
          fi
          git commit -m "Ενημέρωση X-Ray & ENTSO-E δεδομένων: $(TZ=Europe/Athens date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push απέτυχε (προσπάθεια $i), νέα δοκιμή σε 10s..."
            sleep 10
          done
          echo "Το push απέτυχε μετά από 3 προσπάθειες."
          exit 1
