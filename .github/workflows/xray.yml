name: X-Ray & ENTSO-E Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (YYYYMMDD)'
        required: true
        default: '20260901'
      end_date:
        description: 'End Date (YYYYMMDD)'
        required: true
        default: '20260930'

jobs:
  build-xray-and-ref:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Απαραίτητο για να έχει το ιστορικό ώστε να κάνει επιτυχημένο rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz pandas xlrd openpyxl

      - name: Run X-Ray Builder
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: python xray_builder.py

      - name: Run ENTSO-E Builder
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python entsoe_builder.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/xray_data.json data/entsoe_ref.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Ενημέρωση X-Ray & ENTSO-E δεδομένων: $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
